{% macro icon(name, cls="") -%}
<svg class="i {{ cls }}" aria-hidden="true"><use href="#i-{{ name }}"></use></svg>
{%- endmacro %}

{% macro emblem(size=30) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2.5 27 6.5v8.2c0 7.1-4.7 12.3-11 14.8C9.7 27 5 21.8 5 14.7V6.5z" stroke="#27D8FF" stroke-width="1.6" stroke-linejoin="round"></path><path d="M10 15.5h3l2-4 3 8 2-4h2" stroke="#E8EEF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{%- endmacro %}

{% macro nav_link(key, label, icon_name, href, active, badge_id=None) -%}
<a class="nav-link{% if active == key %} active{% endif %}" href="{{ href }}"{% if active == key %} aria-current="page"{% endif %}>
  {{ icon(icon_name) }}<span>{{ label }}</span>
  {% if badge_id %}<span class="nav-badge hidden" id="{{ badge_id }}"></span>{% endif %}
</a>
{%- endmacro %}
